image boot.vfat {
    vfat {
        files = {
            "sun60i-a733-cubie-a7a.dtb",
            "cubie-a7a-flight-stack.dtbo",
            "boot.scr",
            "Image",
            "uboot.env"
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {}

    partition boot0 {
        in-partition-table = false
        image = "boot0_sdcard.bin"
        offset = 128K # Sector 256 (128 KB) - Full 240 KB boot0 with valid eGON checksum
    }

    partition boot_package {
        in-partition-table = false
        image = "boot_package.fex"
        offset = 12288K # Sector 24576 (12 MB) - TOC1 Boot Package
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
        offset = 32M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
