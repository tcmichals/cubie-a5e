image boot.vfat {
    vfat {
        files = {
            "sun60i-a733-cubie-a7a.dtb",
            "cubie-a7a-flight-stack.dtbo",
            "boot.scr",
            "Image",
            "uboot.env"
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {}

    partition u-boot {
        in-partition-table = false
        image = "radxa_a733_bootloader.bin"
        offset = 0
        holes = {"(440; 512)"}
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
        offset = 16M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}

