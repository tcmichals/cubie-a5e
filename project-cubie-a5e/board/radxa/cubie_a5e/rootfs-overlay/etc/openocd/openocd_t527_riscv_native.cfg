# openocd_t527_riscv_native.cfg — T527 XuanTie E907 On-Chip Direct MMIO Debug Configuration
#
# This OpenOCD configuration accesses the XuanTie RISC-V hardware Debug Module (DM)
# directly over the internal SoC memory bus via /dev/mem at physical address 0x07090000.
#
# No external hardware JTAG probe or GPIO wiring required!

# ---- Adapter: On-Chip Direct Memory-Mapped (DMEM) Driver (/dev/mem) ----
adapter driver dmem
dmem device /dev/mem
dmem base_address 0x07090000

# ---- RISC-V Target Definition ----
set _CHIPNAME t527
target create $_CHIPNAME.riscv riscv -dap dmem -dbgbase 0x07090000 -coreid 0

# ---- GDB Server Port ----
gdb_port 3333
telnet_port 4444

reset_config none
init
