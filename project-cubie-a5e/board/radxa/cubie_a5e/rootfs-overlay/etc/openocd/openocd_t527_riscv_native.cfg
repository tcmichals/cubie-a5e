# openocd_t527_riscv_native.cfg — On-Chip Direct Memory-Mapped (DMEM) OpenOCD Configuration
#
# Note: Designed for memory-mapped DMEM bus interfaces (e.g. TI AM62x / STM32MP1).
# On current T527 silicon, the debug module is not memory-mapped to the ARM bus;
# standard firmware diagnostics utilize RemoteProc trace0 and S_UART0 serial.
# This config serves as the reference template for future silicon supporting native DMEM.
#
# ---- Adapter: On-Chip Direct Memory-Mapped (DMEM) Driver ----
adapter driver dmem
dmem device /dev/mem
dmem base_address 0x07090000

# ---- RISC-V Target Definition ----
set _CHIPNAME t527
target create $_CHIPNAME.riscv riscv -dap dmem -dbgbase 0x07090000 -coreid 0

# ---- GDB Server Port ----
gdb_port 3333
telnet_port 4444

reset_config none
init
