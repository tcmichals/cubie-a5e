image boot.vfat {
    vfat {
        files = {
            "sun55i-a527-cubie-a5e.dtb",
            "cubie-a5e-flight-stack.dtbo",
            "cubie-a5e-rpmsg-sram.dtbo",
            "cubie-a5e-uio.dtbo",
            "cubie-a5e-dsp.dtbo",
            "cubie-a5e-mailbox-test.dtbo",
            "cubie-a5e-dsp-mailbox-test.dtbo",
            "cubie-a5e-dual-mailbox-test.dtbo",
            "cubie-a5e-testBasic.dtbo",
            "cubie-a5e-testStringBinaryTrace0.dtbo",
            "cubie-a5e-testCrash.dtbo",
            "cubie-a5e-testPing.dtbo",
            "cubie-a5e-testPingRpmsg.dtbo",
            "cubie-a5e-testPingRpmsgSram.dtbo",
            "cubie-a5e-testDRAMMsg.dtbo",
            "config.txt",
            "uEnv.txt",
            "boot.scr",
            "Image",
            "uboot.env"
        }
    }
    size = 64M
}
image sdcard.img {
    hdimage {}

    partition u-boot {
        in-partition-table = false
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
        size = 1016K
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
        offset = 4M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}

