<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <linearGradient id="gradBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" fill="#f0f6fc" font-size="22" font-weight="700" text-anchor="middle">SRAM Data Cache Coherency Hazard &amp; Tina FreeRTOS Architecture</text>
  <text x="550" y="62" fill="#8b949e" font-size="13" text-anchor="middle">Why D-Cache Clean (`dcache.cpa`) and Invalidate (`dcache.iva`) are Mandatory in Shared SRAM</text>

  <!-- ==================== LEFT: WRITE-BACK STALE MEMORY HAZARD ==================== -->
  <g transform="translate(35, 85)" filter="url(#shadow)">
    <rect width="495" height="340" rx="10" fill="url(#gradBox)" stroke="#30363d" stroke-width="1.5"/>
    <rect width="495" height="38" rx="10" fill="#2d1515" stroke="#da3633" stroke-width="1.5"/>
    <rect y="26" width="495" height="12" fill="#2d1515"/>
    <text x="20" y="24" fill="#f85149" font-size="14" font-weight="700">1. Transmit Hazard: Dirty L1 Cache vs. Stale SRAM</text>

    <!-- RISC-V Core -->
    <rect x="25" y="55" width="200" height="70" rx="6" fill="#0d2d1d" stroke="#238636" stroke-width="1.2"/>
    <text x="125" y="80" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">XuanTie E906 Core</text>
    <text x="125" y="100" fill="#c9d1d9" font-size="11" text-anchor="middle">Writes RPMsg TX Buffer</text>

    <!-- Arrow from Core to L1 -->
    <line x1="225" y1="90" x2="265" y2="90" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- L1 D-Cache -->
    <rect x="270" y="55" width="200" height="70" rx="6" fill="#3d2a0d" stroke="#d29922" stroke-width="1.2"/>
    <text x="370" y="78" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">L1 Data Cache (DE=1)</text>
    <text x="370" y="98" fill="#f0883e" font-size="11" font-weight="700" text-anchor="middle">[DIRTY LINE: Payload 0x42]</text>
    <text x="370" y="114" fill="#8b949e" font-size="10" text-anchor="middle">Write-Back Policy Holds Data</text>

    <!-- Crossbar Barrier -->
    <line x1="25" y1="145" x2="470" y2="145" stroke="#da3633" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="247" y="141" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">NON-COHERENT SYSTEM CROSSBAR (NO SNOOPING)</text>

    <!-- Physical SRAM -->
    <rect x="25" y="165" width="200" height="75" rx="6" fill="#1b1f24" stroke="#484f58" stroke-width="1.2"/>
    <text x="125" y="190" fill="#8b949e" font-size="13" font-weight="600" text-anchor="middle">Physical SRAM A3 / A2</text>
    <text x="125" y="210" fill="#f85149" font-size="11" font-weight="700" text-anchor="middle">[STALE MEMORY: 0x00]</text>
    <text x="125" y="226" fill="#8b949e" font-size="10" text-anchor="middle">Physical Cells Not Updated Yet!</text>

    <!-- Arrow ARM to SRAM -->
    <line x1="270" y1="202" x2="230" y2="202" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- ARM Host -->
    <rect x="270" y="165" width="200" height="75" rx="6" fill="#0d1f38" stroke="#1f6feb" stroke-width="1.2"/>
    <text x="370" y="190" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">ARM Cortex-A55 Host</text>
    <text x="370" y="210" fill="#c9d1d9" font-size="11" text-anchor="middle">Receives Msgbox Doorbell</text>
    <text x="370" y="226" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">💥 Reads Stale SRAM 0x00!</text>

    <!-- Resolution Note -->
    <rect x="25" y="260" width="445" height="60" rx="6" fill="#0d2d1d" stroke="#238636" stroke-width="1"/>
    <text x="40" y="282" fill="#56d364" font-size="12" font-weight="700">✓ The Tina FreeRTOS Fix (dcache.cpa):</text>
    <text x="40" y="302" fill="#c9d1d9" font-size="11">Execute `dcache.cpa a5` (.word 0x0297800b) to flush dirty lines to physical</text>
    <text x="40" y="316" fill="#c9d1d9" font-size="11">SRAM BEFORE asserting mailbox doorbell (`hal_msgbox_send`).</text>
  </g>

  <!-- ==================== RIGHT: READ STALE CACHE HAZARD ==================== -->
  <g transform="translate(565, 85)" filter="url(#shadow)">
    <rect width="495" height="340" rx="10" fill="url(#gradBox)" stroke="#30363d" stroke-width="1.5"/>
    <rect width="495" height="38" rx="10" fill="#2d1515" stroke="#da3633" stroke-width="1.5"/>
    <rect y="26" width="495" height="12" fill="#2d1515"/>
    <text x="20" y="24" fill="#f85149" font-size="14" font-weight="700">2. Receive Hazard: Fresh SRAM vs. Stale L1 Cache</text>

    <!-- ARM Host -->
    <rect x="25" y="55" width="200" height="70" rx="6" fill="#0d1f38" stroke="#1f6feb" stroke-width="1.2"/>
    <text x="125" y="80" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">ARM Cortex-A55 Host</text>
    <text x="125" y="100" fill="#c9d1d9" font-size="11" text-anchor="middle">Writes New RPMsg RX Buffer</text>

    <!-- Arrow ARM to SRAM -->
    <line x1="225" y1="90" x2="265" y2="90" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Physical SRAM -->
    <rect x="270" y="55" width="200" height="70" rx="6" fill="#0d2d1d" stroke="#238636" stroke-width="1.2"/>
    <text x="370" y="78" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">Physical SRAM A3 / A2</text>
    <text x="370" y="98" fill="#56d364" font-size="11" font-weight="700" text-anchor="middle">[FRESH DATA: 0x99]</text>
    <text x="370" y="114" fill="#8b949e" font-size="10" text-anchor="middle">Successfully Placed by Host</text>

    <!-- Crossbar Barrier -->
    <line x1="25" y1="145" x2="470" y2="145" stroke="#da3633" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="247" y="141" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">NON-COHERENT SYSTEM CROSSBAR (NO SNOOPING)</text>

    <!-- L1 D-Cache -->
    <rect x="25" y="165" width="200" height="75" rx="6" fill="#3d2a0d" stroke="#d29922" stroke-width="1.2"/>
    <text x="125" y="190" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">L1 Data Cache (DE=1)</text>
    <text x="125" y="210" fill="#f85149" font-size="11" font-weight="700" text-anchor="middle">[STALE LINE: 0x11]</text>
    <text x="125" y="226" fill="#8b949e" font-size="10" text-anchor="middle">Held from previous read operation</text>

    <!-- Arrow Core to L1 -->
    <line x1="270" y1="202" x2="230" y2="202" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- RISC-V Core -->
    <rect x="270" y="165" width="200" height="75" rx="6" fill="#0d2d1d" stroke="#238636" stroke-width="1.2"/>
    <text x="370" y="190" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">XuanTie E906 Core</text>
    <text x="370" y="210" fill="#c9d1d9" font-size="11" text-anchor="middle">Receives Doorbell Interrupt</text>
    <text x="370" y="226" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">💥 Reads Stale Cache 0x11!</text>

    <!-- Resolution Note -->
    <rect x="25" y="260" width="445" height="60" rx="6" fill="#0d2d1d" stroke="#238636" stroke-width="1"/>
    <text x="40" y="282" fill="#56d364" font-size="12" font-weight="700">✓ The Tina FreeRTOS Fix (dcache.iva):</text>
    <text x="40" y="302" fill="#c9d1d9" font-size="11">Execute `dcache.iva a5` (.word 0x02a7800b) to invalidate the cache line</text>
    <text x="40" y="316" fill="#c9d1d9" font-size="11">BEFORE reading newly arrived payload from physical SRAM.</text>
  </g>

  <!-- ==================== BOTTOM: BARE-METAL / E902 DIRECT NON-CACHED ==================== -->
  <g transform="translate(35, 445)" filter="url(#shadow)">
    <rect width="1025" height="110" rx="10" fill="#0e2316" stroke="#238636" stroke-width="1.5"/>
    <text x="30" y="32" fill="#3fb950" font-size="15" font-weight="700">3. The Reference Solution: Deterministic Non-Cached SRAM (`mhcr.DE = 0` / XuanTie E902)</text>
    <text x="30" y="58" fill="#c9d1d9" font-size="12">
      • <tspan fill="#58a6ff" font-weight="600">riscv-firmware (T527 E906):</tspan> D-Cache is intentionally kept disabled (`mhcr.DE = 0`). Every load and store executes directly against physical SRAM with zero coherency hazards.
    </text>
    <text x="30" y="80" fill="#c9d1d9" font-size="12">
      • <tspan fill="#f0883e" font-weight="600">Cubie A7A (A733 E902):</tspan> Silicon omits L1 D-Cache entirely. Every memory cycle reaches System SRAM A2 (0x00040000) with 0-wait-state hardware coherency.
    </text>
    <text x="30" y="98" fill="#8b949e" font-size="11">
      Result: 100% zero-copy, bug-free, deterministic inter-processor communication without a single line of cache maintenance code.
    </text>
  </g>
</svg>