<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bc8cff"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f0883e"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" fill="#f0f6fc" font-size="22" font-weight="700" text-anchor="middle">Allwinner A733 Heterogeneous Architecture (Radxa Cubie A7A)</text>
  <text x="550" y="62" fill="#8b949e" font-size="13" text-anchor="middle">64-bit Armv8.2-A Cluster $\leftrightarrow$ System Interconnect $\leftrightarrow$ 32-bit XuanTie E902 Real-Time Engine</text>

  <!-- Main Enclosure -->
  <rect x="25" y="80" width="1050" height="540" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- ==================== LEFT: ARM HOST CLUSTER ==================== -->
  <g transform="translate(45, 100)" filter="url(#shadow)">
    <rect width="460" height="180" rx="8" fill="#0d1f38" stroke="#1f6feb" stroke-width="1.5"/>
    <rect width="460" height="34" rx="8" fill="#162c4e"/>
    <rect y="24" width="460" height="10" fill="#162c4e"/>
    <text x="230" y="23" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">Application Cluster (Arm64 Host)</text>

    <!-- Sub-elements -->
    <rect x="15" y="45" width="205" height="55" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
    <text x="117" y="68" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">4× Cortex-A76 @ 2.0 GHz</text>
    <text x="117" y="88" fill="#8b949e" font-size="10" text-anchor="middle">High Performance Big Cores</text>

    <rect x="240" y="45" width="205" height="55" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
    <text x="342" y="68" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">4× Cortex-A55 @ 1.8 GHz</text>
    <text x="342" y="88" fill="#8b949e" font-size="10" text-anchor="middle">Power-Efficient Little Cores</text>

    <rect x="15" y="112" width="430" height="52" rx="5" fill="#0d1117" stroke="#1f6feb" stroke-width="1"/>
    <text x="230" y="133" fill="#79c0ff" font-size="12" font-weight="600" text-anchor="middle">Mainline Linux 7.1 PREEMPT_RT + Stock Arm TF-A (BL31)</text>
    <text x="230" y="151" fill="#8b949e" font-size="10" text-anchor="middle">Vision Pipelines • ROS 2 Navigation • Networking &amp; File Systems</text>
  </g>

  <!-- ==================== RIGHT: XUANTIE E902 COPROCESSOR ==================== -->
  <g transform="translate(595, 100)" filter="url(#shadow)">
    <rect width="460" height="180" rx="8" fill="#09261a" stroke="#238636" stroke-width="1.5"/>
    <rect width="460" height="34" rx="8" fill="#113e2b"/>
    <rect y="24" width="460" height="10" fill="#113e2b"/>
    <text x="230" y="23" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Real-Time Coprocessor (RISC-V E902)</text>

    <!-- Sub-elements -->
    <rect x="15" y="45" width="205" height="55" rx="5" fill="#161b22" stroke="#2ea043" stroke-width="1"/>
    <text x="117" y="68" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">T-Head XuanTie E902</text>
    <text x="117" y="88" fill="#8b949e" font-size="10" text-anchor="middle">RV32EMC @ 200 MHz</text>

    <rect x="240" y="45" width="205" height="55" rx="5" fill="#161b22" stroke="#2ea043" stroke-width="1"/>
    <text x="342" y="68" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">16 GPRs (x0 - x15)</text>
    <text x="342" y="88" fill="#8b949e" font-size="10" text-anchor="middle">Microsecond Hard Determinism</text>

    <rect x="15" y="112" width="430" height="52" rx="5" fill="#0d1117" stroke="#238636" stroke-width="1"/>
    <text x="230" y="133" fill="#56d364" font-size="12" font-weight="600" text-anchor="middle">FreeRTOS / Bare-Metal C++ Real-Time Firmwares</text>
    <text x="230" y="151" fill="#8b949e" font-size="10" text-anchor="middle">DShot ESC Telemetry • Sub-µs PWM • ADC Sampling • Fail-Safe Watchdogs</text>
  </g>

  <!-- Bus arrows from clusters -->
  <line x1="275" y1="280" x2="275" y2="320" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="290" y="305" fill="#58a6ff" font-size="11" font-weight="600">64-bit AXI Host Master</text>

  <line x1="825" y1="280" x2="825" y2="320" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="840" y="305" fill="#3fb950" font-size="11" font-weight="600">32-bit AXI Coprocessor Master</text>

  <!-- ==================== CENTER: SYSTEM FABRIC INTERCONNECT ==================== -->
  <g transform="translate(45, 320)" filter="url(#shadow)">
    <rect width="1010" height="42" rx="6" fill="#1c2128" stroke="#8b949e" stroke-width="1.5"/>
    <text x="505" y="26" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">System Interconnect &amp; Crossbar Fabric (Non-Blocking AXI/AHB Bus)</text>
  </g>

  <!-- Bus down arrows -->
  <line x1="165" y1="362" x2="165" y2="400" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="410" y1="362" x2="410" y2="400" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="685" y1="362" x2="685" y2="400" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="935" y1="362" x2="935" y2="400" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ==================== BOTTOM: MEMORY & PERIPHERALS ==================== -->
  <!-- Box 1: System SRAM A2 -->
  <g transform="translate(45, 400)" filter="url(#shadow)">
    <rect width="235" height="190" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <rect width="235" height="30" rx="8" fill="#0d1f38"/>
    <rect y="20" width="235" height="10" fill="#0d1f38"/>
    <text x="117" y="21" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">System SRAM A2 (208 KB)</text>

    <!-- Forbidden 16K -->
    <rect x="12" y="40" width="211" height="40" rx="4" fill="#321616" stroke="#f85149" stroke-width="1"/>
    <text x="117" y="56" fill="#ff7b72" font-size="10" font-weight="600" text-anchor="middle">0x00040000 (16 KB): CPUS ONLY</text>
    <text x="117" y="72" fill="#8b949e" font-size="9" text-anchor="middle">Power PMIC Sequencer (Inaccessible)</text>

    <!-- Usable 192K -->
    <rect x="12" y="88" width="211" height="88" rx="4" fill="#0d2d1d" stroke="#2ea043" stroke-width="1"/>
    <text x="117" y="106" fill="#56d364" font-size="11" font-weight="700" text-anchor="middle">0x00044000 (192 KB Usable)</text>
    <text x="117" y="124" fill="#c9d1d9" font-size="10" text-anchor="middle">E902 Base: 0x40004000</text>
    <text x="117" y="142" fill="#8b949e" font-size="9" text-anchor="middle">• VirtIO Rings (vring0 / vring1)</text>
    <text x="117" y="158" fill="#8b949e" font-size="9" text-anchor="middle">• SPSC Queues • Shared Descriptors</text>
  </g>

  <!-- Box 2: Hardware MSGBOX0 -->
  <g transform="translate(295, 400)" filter="url(#shadow)">
    <rect width="230" height="190" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
    <rect width="230" height="30" rx="8" fill="#3b2300"/>
    <rect y="20" width="230" height="10" fill="#3b2300"/>
    <text x="115" y="21" fill="#ffa657" font-size="12" font-weight="700" text-anchor="middle">Hardware MSGBOX0</text>

    <text x="115" y="55" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">Base: 0x07090000</text>
    <text x="115" y="73" fill="#8b949e" font-size="10" text-anchor="middle">8 Bidirectional Hardware FIFOs</text>

    <rect x="15" y="85" width="200" height="42" rx="4" fill="#1c2128" stroke="#f0883e" stroke-width="0.8"/>
    <text x="115" y="102" fill="#c9d1d9" font-size="10" text-anchor="middle">Arm Host $\rightarrow$ E902 Kick IRQ</text>
    <text x="115" y="117" fill="#8b949e" font-size="9" text-anchor="middle">Ch 0: Host transmits mailbox interrupt</text>

    <rect x="15" y="134" width="200" height="42" rx="4" fill="#1c2128" stroke="#f0883e" stroke-width="0.8"/>
    <text x="115" y="151" fill="#c9d1d9" font-size="10" text-anchor="middle">E902 $\rightarrow$ Arm Host Doorbell</text>
    <text x="115" y="166" fill="#8b949e" font-size="9" text-anchor="middle">Ch 1: Coprocessor triggers SPI IRQ 127</text>
  </g>

  <!-- Box 3: Main LPDDR5 DRAM -->
  <g transform="translate(540, 400)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.2"/>
    <rect width="260" height="30" rx="8" fill="#2e1a47"/>
    <rect y="20" width="260" height="10" fill="#2e1a47"/>
    <text x="130" y="21" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">Main LPDDR5 DRAM (4GB / 6GB)</text>

    <text x="130" y="55" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">0x40000000 - 0x1BFFFFFFF</text>
    <text x="130" y="73" fill="#8b949e" font-size="10" text-anchor="middle">High-Bandwidth Shared Memory</text>

    <rect x="15" y="85" width="230" height="42" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="0.8"/>
    <text x="130" y="102" fill="#c9d1d9" font-size="10" text-anchor="middle">Linux OS &amp; Userspace Memory</text>
    <text x="130" y="117" fill="#8b949e" font-size="9" text-anchor="middle">Main memory pool for Linux 7.1 RT</text>

    <rect x="15" y="134" width="230" height="42" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="0.8"/>
    <text x="130" y="151" fill="#c9d1d9" font-size="10" text-anchor="middle">CMA / DMA-Buf Carveouts</text>
    <text x="130" y="166" fill="#8b949e" font-size="9" text-anchor="middle">Zero-copy camera/encoder frames</text>
  </g>

  <!-- Box 4: Direct I/O Peripherals -->
  <g transform="translate(815, 400)" filter="url(#shadow)">
    <rect width="240" height="190" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/>
    <rect width="240" height="30" rx="8" fill="#09261a"/>
    <rect y="20" width="240" height="10" fill="#09261a"/>
    <text x="120" y="21" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Hard Real-Time I/O Peripherals</text>

    <rect x="12" y="42" width="216" height="30" rx="4" fill="#1c2128" stroke="#30363d" stroke-width="0.8"/>
    <text x="120" y="62" fill="#f0f6fc" font-size="10" font-weight="600" text-anchor="middle">High-Rate PWM (DShot / Motors)</text>

    <rect x="12" y="78" width="216" height="30" rx="4" fill="#1c2128" stroke="#30363d" stroke-width="0.8"/>
    <text x="120" y="98" fill="#f0f6fc" font-size="10" font-weight="600" text-anchor="middle">Dedicated SPI / I2C Buses (IMUs)</text>

    <rect x="12" y="114" width="216" height="30" rx="4" fill="#1c2128" stroke="#30363d" stroke-width="0.8"/>
    <text x="120" y="134" fill="#f0f6fc" font-size="10" font-weight="600" text-anchor="middle">Analog-to-Digital Converter (GPADC)</text>

    <rect x="12" y="150" width="216" height="30" rx="4" fill="#1c2128" stroke="#30363d" stroke-width="0.8"/>
    <text x="120" y="170" fill="#f0f6fc" font-size="10" font-weight="600" text-anchor="middle">Emergency Hardware Watchdog</text>
  </g>
</svg>