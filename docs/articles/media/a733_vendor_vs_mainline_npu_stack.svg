<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 364" width="1120" height="364" overflow="hidden" style="background:#0d1117; max-width:100%; height:auto; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="1120" height="364" fill="#0d1117"/>
  <text x="560" y="34" fill="#f0f6fc" font-size="19" font-weight="700" text-anchor="middle">Legacy Vendor NPU Stack vs. Mainline Open-Source Stack</text>
  <text x="560" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Replacing out-of-tree vipcore/VIPlite binary blobs with mainline Linux 7.1 etnaviv + Mesa Teflon</text>
  <rect x="24" y="76" width="1072" height="266" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="24" y="76" width="1072" height="38" rx="10" fill="#371f57"/>
  <rect x="24" y="104" width="1072" height="10" fill="#371f57"/>
  <text x="36" y="100" fill="#d2a8ff" font-size="12" font-weight="700">Feature</text>
  <line x1="234" y1="76" x2="234" y2="342" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="100" fill="#d2a8ff" font-size="12" font-weight="700">Legacy Vendor Stack (vipcore / VIPlite)</text>
  <line x1="644" y1="76" x2="644" y2="342" stroke="#30363d" stroke-width="1"/>
  <text x="656" y="100" fill="#d2a8ff" font-size="12" font-weight="700">Mainline Open-Source Stack (etnaviv + Teflon)</text>
  <rect x="25" y="114" width="1070" height="36" fill="#161b22"/>
  <line x1="24" y1="114" x2="1096" y2="114" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="136" fill="#f0f6fc" font-size="11" font-weight="600">Kernel Driver</text>
  <line x1="234" y1="114" x2="234" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="136" fill="#ffa657" font-size="11" font-weight="400">Out-of-tree 44K-line vipcore.ko / galcore.ko</text>
  <line x1="644" y1="114" x2="644" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="656" y="136" fill="#56d364" font-size="11" font-weight="400">In-tree mainline drivers/gpu/drm/etnaviv/ (CONFIG_DRM_ETNAVIV=y)</text>
  <rect x="25" y="150" width="1070" height="52" fill="#1c2128"/>
  <line x1="24" y1="150" x2="1096" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="172" fill="#f0f6fc" font-size="11" font-weight="600">Device Node &amp; Memory API</text>
  <line x1="234" y1="150" x2="234" y2="202" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="172" fill="#ffa657" font-size="11" font-weight="400">Custom /dev/vipcore ioctl ABI</text>
  <line x1="644" y1="150" x2="644" y2="202" stroke="#30363d" stroke-width="1"/>
  <text x="656" y="172" fill="#56d364" font-size="11" font-weight="400">Standard Linux DRM render node /dev/dri/renderD128, GEM &amp; dma-buf</text>
  <text x="656" y="188" fill="#56d364" font-size="11" font-weight="400">PRIME</text>
  <rect x="25" y="202" width="1070" height="52" fill="#161b22"/>
  <line x1="24" y1="202" x2="1096" y2="202" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="224" fill="#f0f6fc" font-size="11" font-weight="600">Userspace AI Interface</text>
  <line x1="234" y1="202" x2="234" y2="254" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="224" fill="#ffa657" font-size="11" font-weight="400">Proprietary libVIPlite.so / TIM-VX blobs</text>
  <line x1="644" y1="202" x2="644" y2="254" stroke="#30363d" stroke-width="1"/>
  <text x="656" y="224" fill="#56d364" font-size="11" font-weight="400">Open-source Mesa 26.1.8 Teflon (libteflon.so) TFLite external</text>
  <text x="656" y="240" fill="#56d364" font-size="11" font-weight="400">delegate</text>
  <rect x="25" y="254" width="1070" height="36" fill="#1c2128"/>
  <line x1="24" y1="254" x2="1096" y2="254" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="276" fill="#f0f6fc" font-size="11" font-weight="600">Model Format</text>
  <line x1="234" y1="254" x2="234" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="276" fill="#ffa657" font-size="11" font-weight="400">Proprietary offline-compiled .nb binary</text>
  <line x1="644" y1="254" x2="644" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="656" y="276" fill="#56d364" font-size="11" font-weight="400">Standard quantized .tflite models compiled on the fly at load time</text>
  <rect x="25" y="290" width="1070" height="51" rx="9" fill="#161b22"/>
  <rect x="25" y="290" width="1070" height="10" fill="#161b22"/>
  <line x1="24" y1="290" x2="1096" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="312" fill="#f0f6fc" font-size="11" font-weight="600">Multi-Process Safety</text>
  <line x1="234" y1="290" x2="234" y2="342" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="312" fill="#ffa657" font-size="11" font-weight="400">Shared global address space</text>
  <line x1="644" y1="290" x2="644" y2="342" stroke="#30363d" stroke-width="1"/>
  <text x="656" y="312" fill="#56d364" font-size="11" font-weight="400">Per-process MMUv2 virtual page tables + drm_gpu_scheduler hang</text>
  <text x="656" y="328" fill="#56d364" font-size="11" font-weight="400">recovery</text>
</svg>
