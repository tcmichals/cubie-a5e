<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 688" width="1120" height="688" overflow="hidden" style="background:#0d1117; max-width:100%; height:auto; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="1120" height="688" fill="#0d1117"/>
  <text x="560" y="34" fill="#f0f6fc" font-size="19" font-weight="700" text-anchor="middle">Allwinner A733 (0x9202) vs. T527 / A527 (0x9003) NPU Silicon Comparison</text>
  <text x="560" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Verified from live Radxa Cubie A7A silicon (/sys/kernel/debug/dri/0/gpu) &amp; allwinner/gc_feature_database.h</text>
  <rect x="24" y="76" width="1072" height="590" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <rect x="24" y="76" width="1072" height="38" rx="10" fill="#162c4e"/>
  <rect x="24" y="104" width="1072" height="10" fill="#162c4e"/>
  <text x="36" y="100" fill="#58a6ff" font-size="12" font-weight="700">Hardware Parameter</text>
  <line x1="244" y1="76" x2="244" y2="666" stroke="#30363d" stroke-width="1"/>
  <text x="256" y="100" fill="#58a6ff" font-size="12" font-weight="700">Allwinner A733 (Cubie A7A)</text>
  <line x1="494" y1="76" x2="494" y2="666" stroke="#30363d" stroke-width="1"/>
  <text x="506" y="100" fill="#58a6ff" font-size="12" font-weight="700">Allwinner T527 / A527 (A5E)</text>
  <line x1="724" y1="76" x2="724" y2="666" stroke="#30363d" stroke-width="1"/>
  <text x="736" y="100" fill="#58a6ff" font-size="12" font-weight="700">What It Means in Practice</text>
  <rect x="25" y="114" width="1070" height="36" fill="#161b22"/>
  <line x1="24" y1="114" x2="1096" y2="114" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="136" fill="#f0f6fc" font-size="11" font-weight="600">Silicon IP Name</text>
  <line x1="244" y1="114" x2="244" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="256" y="136" fill="#79c0ff" font-size="11" font-weight="400">VeriSilicon VIP9000Nano-DI (HW_V83)</text>
  <line x1="494" y1="114" x2="494" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="506" y="136" fill="#ffa657" font-size="11" font-weight="400">VeriSilicon VIP9000Nano-SI+</text>
  <line x1="724" y1="114" x2="724" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="736" y="136" fill="#c9d1d9" font-size="11" font-weight="400">Newer HW_V83 (VIP_VERSION 0x398) IP on A733</text>
  <rect x="25" y="150" width="1070" height="36" fill="#1c2128"/>
  <line x1="24" y1="150" x2="1096" y2="150" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="172" fill="#f0f6fc" font-size="11" font-weight="600">Marketed Peak Throughput</text>
  <line x1="244" y1="150" x2="244" y2="186" stroke="#30363d" stroke-width="1"/>
  <text x="256" y="172" fill="#79c0ff" font-size="11" font-weight="400">3.0 TOPS (INT8, 492-1120 MHz OPP)</text>
  <line x1="494" y1="150" x2="494" y2="186" stroke="#30363d" stroke-width="1"/>
  <text x="506" y="172" fill="#ffa657" font-size="11" font-weight="400">2.0 TOPS (INT8)</text>
  <line x1="724" y1="150" x2="724" y2="186" stroke="#30363d" stroke-width="1"/>
  <text x="736" y="172" fill="#c9d1d9" font-size="11" font-weight="400">Higher NN core count &amp; clock scaling on A733</text>
  <rect x="25" y="186" width="1070" height="36" fill="#161b22"/>
  <line x1="24" y1="186" x2="1096" y2="186" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="208" fill="#f0f6fc" font-size="11" font-weight="600">MMIO Base Address</text>
