  <text x="256" y="244" fill="#79c0ff" font-size="11" font-weight="400">GIC_SPI 65 (hwirq 97)</text>
  <line x1="494" y1="222" x2="494" y2="258" stroke="#30363d" stroke-width="1"/>
  <text x="506" y="244" fill="#ffa657" font-size="11" font-weight="400">GIC_SPI 157</text>
  <line x1="724" y1="222" x2="724" y2="258" stroke="#30363d" stroke-width="1"/>
  <text x="736" y="244" fill="#c9d1d9" font-size="11" font-weight="400">Signals Front-End (FE) command completion</text>
  <rect x="25" y="258" width="1070" height="36" fill="#161b22"/>
  <line x1="24" y1="258" x2="1096" y2="258" stroke="#30363d" stroke-width="1"/>
