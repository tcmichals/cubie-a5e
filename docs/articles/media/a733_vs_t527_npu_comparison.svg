  <line x1="244" y1="258" x2="244" y2="294" stroke="#30363d" stroke-width="1"/>
  <text x="256" y="280" fill="#79c0ff" font-size="11" font-weight="400">0x9000</text>
  <line x1="494" y1="258" x2="494" y2="294" stroke="#30363d" stroke-width="1"/>
  <text x="506" y="280" fill="#ffa657" font-size="11" font-weight="400">0x9000</text>
  <line x1="724" y1="258" x2="724" y2="294" stroke="#30363d" stroke-width="1"/>
