<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" fill="#f0f6fc" font-size="22" font-weight="700" text-anchor="middle">Boot Sequence Autopsy: Vendor Firmware vs. Clean Remoteproc</text>
  <text x="550" y="62" fill="#8b949e" font-size="13" text-anchor="middle">Unlocking the XuanTie E902 by Removing scp.fex from the TOC1 Bootstream</text>

  <!-- ==================== TOP FLOW: VENDOR BSP ==================== -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="1040" height="225" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect width="1040" height="34" rx="10" fill="#321616"/>
    <rect y="24" width="1040" height="10" fill="#321616"/>
    <text x="25" y="23" fill="#ff7b72" font-size="14" font-weight="700">❌ VENDOR BSP BOOT CHAIN: E902 Trapped as ARISC Power Coprocessor</text>

    <!-- Step 1: SPL -->
    <rect x="25" y="55" width="165" height="135" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="107" y="80" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">1. U-Boot SPL (BL2)</text>
    <text x="107" y="105" fill="#8b949e" font-size="10" text-anchor="middle">• DRAM training</text>
    <text x="107" y="125" fill="#8b949e" font-size="10" text-anchor="middle">• Reads TOC1 image</text>
    <text x="107" y="145" fill="#8b949e" font-size="10" text-anchor="middle">• Contains scp.fex!</text>
    <text x="107" y="170" fill="#f0883e" font-size="10" font-weight="600" text-anchor="middle">Loads BL31 &amp; SCP</text>

    <!-- Arrow -->
    <line x1="190" y1="122" x2="225" y2="122" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 2: BL31 -->
    <rect x="230" y="55" width="220" height="135" rx="6" fill="#211517" stroke="#f85149" stroke-width="1.2"/>
    <text x="340" y="80" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">2. Arm TF-A (BL31)</text>
    <text x="340" y="105" fill="#c9d1d9" font-size="10" text-anchor="middle">• Sees scp.fex in TOC1</text>
    <text x="340" y="125" fill="#c9d1d9" font-size="10" text-anchor="middle">• Copies binary into SRAM A2</text>
    <text x="340" y="145" fill="#ff7b72" font-size="10" font-weight="600" text-anchor="middle">• Boots E902 as ARISC</text>
    <text x="340" y="165" fill="#8b949e" font-size="10" text-anchor="middle">• Locks core to sleep loop</text>

    <!-- Arrow -->
    <line x1="450" y1="122" x2="485" y2="122" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 3: Locked Core -->
    <rect x="490" y="55" width="250" height="135" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="615" y="80" fill="#ffa657" font-size="12" font-weight="600" text-anchor="middle">3. E902 Locked in ARISC Mode</text>
    <text x="615" y="105" fill="#8b949e" font-size="10" text-anchor="middle">• Running proprietary blob</text>
    <text x="615" y="125" fill="#8b949e" font-size="10" text-anchor="middle">• Waiting for host suspend</text>
    <text x="615" y="145" fill="#ff7b72" font-size="10" font-weight="600" text-anchor="middle">• Linux can't reset core</text>
    <text x="615" y="165" fill="#8b949e" font-size="10" text-anchor="middle">• 200 MHz core completely wasted</text>

    <!-- Arrow -->
    <line x1="740" y1="122" x2="775" y2="122" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Step 4: Linux Host -->
    <rect x="780" y="55" width="235" height="135" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="897" y="80" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">4. Vendor Linux (5.10 BSP)</text>
    <text x="897" y="105" fill="#8b949e" font-size="10" text-anchor="middle">• No RemoteProc driver</text>
    <text x="897" y="125" fill="#8b949e" font-size="10" text-anchor="middle">• No userspace RPMsg</text>
    <text x="897" y="150" fill="#ff7b72" font-size="11" font-weight="700" text-anchor="middle">❌ Zero Real-Time I/O</text>
  </g>

  <!-- ==================== BOTTOM FLOW: CLEAN REPURPOSED ==================== -->
  <g transform="translate(30, 335)" filter="url(#shadow)">
    <rect width="1040" height="235" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="1040" height="34" rx="10" fill="#09261a"/>
    <rect y="24" width="1040" height="10" fill="#09261a"/>
    <text x="25" y="23" fill="#3fb950" font-size="14" font-weight="700">✅ REPURPOSED CLEAN BOOT CHAIN: Stock BL31 + Standard Mainline RemoteProc</text>

    <!-- Step 1: Clean TOC1 -->
    <rect x="25" y="55" width="165" height="150" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="107" y="80" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">1. U-Boot SPL (BL2)</text>
    <text x="107" y="105" fill="#8b949e" font-size="10" text-anchor="middle">• Reads modified TOC1</text>
    <text x="107" y="125" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">• scp.fex REMOVED!</text>
    <text x="107" y="145" fill="#8b949e" font-size="10" text-anchor="middle">• Only BL31 + U-Boot</text>
    <text x="107" y="175" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">Clean Payload</text>

    <!-- Arrow -->
    <line x1="190" y1="125" x2="225" y2="125" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 2: Stock BL31 -->
    <rect x="230" y="55" width="220" height="150" rx="6" fill="#0c2317" stroke="#2ea043" stroke-width="1.2"/>
    <text x="340" y="80" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">2. Stock Arm TF-A (BL31)</text>
    <text x="340" y="105" fill="#c9d1d9" font-size="10" text-anchor="middle">• No SCP found in TOC1</text>
    <text x="340" y="125" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">• SKIPS TOUCHING E902!</text>
    <text x="340" y="145" fill="#c9d1d9" font-size="10" text-anchor="middle">• E902 stays in cold reset</text>
    <text x="340" y="165" fill="#8b949e" font-size="10" text-anchor="middle">• SRAM A2 completely untouched</text>
    <text x="340" y="185" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">Zero Binary Hacks to BL31</text>

    <!-- Arrow -->
    <line x1="450" y1="125" x2="485" y2="125" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 3: Mainline Linux -->
    <rect x="490" y="55" width="250" height="150" rx="6" fill="#1c2128" stroke="#388bfd" stroke-width="1.2"/>
    <text x="615" y="80" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">3. Linux 7.1 PREEMPT_RT</text>
    <text x="615" y="105" fill="#c9d1d9" font-size="10" text-anchor="middle">• `sunxi_rproc.ko` driver binds</text>
    <text x="615" y="125" fill="#c9d1d9" font-size="10" text-anchor="middle">• Loads custom ELF into 0x40004000</text>
    <text x="615" y="145" fill="#c9d1d9" font-size="10" text-anchor="middle">• Deasserts cfg reset, sets vector</text>
    <text x="615" y="165" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">• Boots E902 cleanly!</text>
    <text x="615" y="185" fill="#8b949e" font-size="10" text-anchor="middle">Full lifecycle control: start / stop</text>

    <!-- Arrow -->
    <line x1="740" y1="125" x2="775" y2="125" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 4: Real-time Coprocessor -->
    <rect x="780" y="55" width="235" height="150" rx="6" fill="#09261a" stroke="#2ea043" stroke-width="1.2"/>
    <text x="897" y="80" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">4. XuanTie E902 Real-Time Engine</text>
    <text x="897" y="105" fill="#c9d1d9" font-size="10" text-anchor="middle">• 14.5 µs average SPSC RTT</text>
    <text x="897" y="125" fill="#c9d1d9" font-size="10" text-anchor="middle">• 120.5 µs VirtIO RPMsg RTT</text>
    <text x="897" y="145" fill="#c9d1d9" font-size="10" text-anchor="middle">• DShot, PWM, Sub-µs IMU Loop</text>
    <text x="897" y="175" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">🚀 Fully Operational</text>
  </g>
</svg>